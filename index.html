let initialy = null

    },

        url: "https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_2MB.mp4"
    }
];

 


function loadsrc(){
  video.src = videos[videoindex].url;
  video.load();
}

loadsrc()




//pointer event
//deactivate touch events to capture pointer events properly 
document.body.style.touchAction = "none";


document.body.onpointerdown = e => {
  document.body.setPointerCapture(e.pointerId);
  initialy = e.clientY;
  playing = !playing 
  directiony = "stay"
}


document.body.onpointermove = function (e){
  const currenty = e.clientY

  if(initialy < currenty){
    directiony = "down" 
    playing = true 
  }
  if(initialy > currenty){
    directiony = "up" 
    playing = true 
  }
}


document.body.onpointerup = e => {
  document.body.releasePointerCapture(e.pointerId);
  const vlength = videos.length
  
  if(directiony == "up"){
  videoindex = (videoindex + 1) % vlength
  current = 0
  loadsrc()
  }
  if(directiony == "down"){
  videoindex = (videoindex - 1 + vlength) % vlength
  current = 0
  loadsrc()
  }
  directiony = "stay"
  
  
  if(playing){
    video.currentTime = current
  }
    
  if(!playing){
    video.pause()
  }
}


video.oncanplay = () => {
  if (playing) video.play();
};

video.onended = ()=>{
    video.currentTime = 0
    video.play()
}


video.ontimeupdate = ()=>{
  current = video.currentTime
