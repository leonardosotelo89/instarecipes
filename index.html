console.log(video,container); 

let initialy = null
let directiony = null
let playing = false
let videoindex = 0
let current = null


const videosPrueba = [
    {
        nombre: "MDN Rabbit",
        url: "https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/rabbit320.mp4"
    },

    }
];


video.src = videosPrueba[videoindex].url




//pointer event
//deactivate touch events to capture pointer events properly 
swipe.style.touchAction = "none";


swipe.onpointerdown = e => {
  swipe.setPointerCapture(e.pointerId);
  initialy = e.clientY;
  playing = !playing 
  
}


swipe.onpointermove = function (e){
  const currenty = e.clientY

  if(initialy < currenty){
    directiony = "down" 
    playing = true 
  }
  if(initialy > currenty){
    directiony = "up" 
    playing = true 
  }
}


swipe.onpointerup = e => {
  swipe.releasePointerCapture(e.pointerId);
  const vlength = videosPrueba.length
  
  if(directiony == "up"){
  videoindex = (videoindex + 1) % vlength
  video.src = videosPrueba[videoindex].url
  current = 0
  }
  if(directiony == "down"){
  videoindex = (videoindex - 1 + vlength) % vlength
  video.src = videosPrueba[videoindex].url
  current = 0
  }
  directiony = "stay"
  
  if(playing){
    video.currentTime = current
    video.play()
  }
  if(!playing){
    video.pause()
  }
}

video.onended = ()=>{
    video.currentTime = 0
    video.play()
}

video.ontimeupdate = ()=>{
  current = video.currentTime 
 // console.log(current); 
}

setInterval(()=>{
  swipe.innerHTML = directiony +"/"+playing+"/"+video.src 
},50)
